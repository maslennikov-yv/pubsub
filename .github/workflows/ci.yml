name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        go: ["1.26.x", "1.27.x"]
        include:
          # The newest leg also runs the benchmark smoke and publishes coverage.
          - go: "1.27.x"
            primary: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
      - name: gofmt
        run: make fmt-check
      - name: go mod tidy -diff
        run: make tidy-check
      - name: go vet
        run: make vet
      - name: go test -race
        run: make test
      - name: Benchmarks (smoke)
        if: matrix.primary
        run: make bench
      - name: Upload coverage
        if: matrix.primary
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

  vuln:
    name: Vulnerability check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: golang/govulncheck-action@v1
        with:
          go-version-input: stable
          go-package: ./...

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: go build ./...
